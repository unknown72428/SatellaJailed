name: Build SatellaJailed Dylib
on: workflow_dispatch

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Theos Compilation Environment
        run: |
          bash -c "$(curl -fsSL https://githubusercontent.com)"
          echo "THEOS=~/theos" >> $GITHUB_ENV

      - name: Build Tweak
        run: |
          export THEOS=~/theos
          cd Tweak
          make package FINALPACKAGE=1
          
      - name: Upload Compiled File
        uses: actions/upload-artifact@v4
        with:
          name: SatellaJailed-Compiled
          path: Tweak/.theos/obj/debug/*.dylib
